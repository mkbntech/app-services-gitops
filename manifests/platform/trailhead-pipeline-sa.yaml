apiVersion: v1
kind: ServiceAccount
metadata:
  name: trailhead-pipeline-sa
  namespace: trailhead-staging
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: trailhead-pipeline-admin-binding
  namespace: trailhead-staging
subjects:
- kind: ServiceAccount
  name: trailhead-pipeline-sa
  namespace: trailhead-staging
roleRef:
  kind: ClusterRole
  name: edit
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: trailhead-pipeline-eventlistener-roles-binding-staging
subjects:
- kind: ServiceAccount
  name: trailhead-pipeline-sa
  namespace: trailhead-staging
roleRef:
  kind: ClusterRole
  name: tekton-triggers-eventlistener-roles
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: trailhead-pipeline-eventlistener-clusterroles-binding-staging
subjects:
- kind: ServiceAccount
  name: trailhead-pipeline-sa
  namespace: trailhead-staging
roleRef:
  kind: ClusterRole
  name: tekton-triggers-eventlistener-clusterroles
  apiGroup: rbac.authorization.k8s.io