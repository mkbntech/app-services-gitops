apiVersion: apps/v1
kind: Deployment
metadata:
  name: reviews-db
  labels:
    app: reviews-db
spec:
  replicas: 1
  selector:
    matchLabels:
      app: reviews-db
  template:
    metadata:
      labels:
        app: reviews-db
    spec:
      containers:
        - name: postgres
          image: docker.io/library/postgres:latest
          env:
            - name: POSTGRES_USER
              value: trailhead
            - name: POSTGRES_PASSWORD
              value: trailhead_pwd
            - name: POSTGRES_DB
              value: reviews_db
          ports:
            - containerPort: 5432
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "trailhead", "-d", "reviews_db"]
            initialDelaySeconds: 5
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: reviews-db
spec:
  ports:
    - port: 5432
      targetPort: 5432
  selector:
    app: reviews-db
