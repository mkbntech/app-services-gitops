# Multi-Node Production Environment Overrides

global:
  namespace: trailhead-production
  environment: production
  registryHost: image-registry.openshift-image-registry.svc:5000/trailhead-production

# Operators are managed separately via dedicated ArgoCD App (trailhead-operators-app)
operators:
  enabled: false

services:
  autoscaling:
    scaleToZeroRetentionPeriod: 300s
    minScale: 1
    maxScale: 10

tekton-cicd:
  enabled: false # CI runs in staging, CD deploys to production
