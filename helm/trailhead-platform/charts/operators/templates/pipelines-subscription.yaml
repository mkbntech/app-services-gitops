{{- if and .Values.enabled .Values.pipelines.enabled }}
apiVersion: operators.coreos.com/v1alpha1
kind: Subscription
metadata:
  name: openshift-pipelines-operator-rh
  namespace: openshift-operators
spec:
  channel: {{ .Values.pipelines.channel | quote }}
  name: openshift-pipelines-operator-rh
  source: {{ .Values.pipelines.source | quote }}
  sourceNamespace: {{ .Values.pipelines.sourceNamespace | quote }}
{{- end }}
