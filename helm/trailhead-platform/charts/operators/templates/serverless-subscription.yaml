{{- if and .Values.enabled .Values.serverless.enabled }}
apiVersion: operators.coreos.com/v1alpha1
kind: Subscription
metadata:
  name: serverless-operator
  namespace: openshift-serverless
spec:
  channel: {{ .Values.serverless.channel | quote }}
  name: serverless-operator
  source: {{ .Values.serverless.source | quote }}
  sourceNamespace: {{ .Values.serverless.sourceNamespace | quote }}
{{- end }}
