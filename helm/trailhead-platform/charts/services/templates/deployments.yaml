{{- if .Values.enabled }}
{{- $global := .Values.global }}
{{- $tag := .Values.tag }}
{{- range $key, $svc := .Values.microservices }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $svc.name }}
  namespace: {{ $global.namespace | default $.Release.Namespace }}
  labels:
    app: {{ $svc.name }}
spec:
  replicas: {{ $svc.replicas | default 1 }}
  selector:
    matchLabels:
      app: {{ $svc.name }}
  template:
    metadata:
      labels:
        app: {{ $svc.name }}
    spec:
      containers:
        - name: {{ $svc.name }}
          image: {{ printf "%s/%s:%s" $global.registryHost $svc.imageName $tag | quote }}
          imagePullPolicy: Always
          ports:
            - containerPort: {{ $svc.port }}
          {{- if $svc.env }}
          env:
            {{- range $eKey, $eVal := $svc.env }}
            - name: {{ $eKey }}
              value: {{ $eVal | quote }}
            {{- end }}
          {{- end }}
          resources:
            {{- toYaml $svc.resources | nindent 12 }}
---
{{- end }}
{{- end }}
