{{- if .Values.enabled }}
{{- $ns := .Values.global.namespace | default .Release.Namespace }}
apiVersion: tekton.dev/v1beta1
kind: Task
metadata:
  name: update-gitops-repository
  namespace: {{ $ns }}
spec:
  params:
    - name: git-revision
    - name: gitops-repo-url
      default: {{ .Values.git.gitopsRepoUrl | quote }}
    - name: gitops-branch
      default: {{ .Values.git.branch | quote }}
    - name: app-namespace
      default: {{ $ns | quote }}
  workspaces:
    - name: source
  steps:
    - name: update-and-push-gitops
      image: alpine/git:latest
      env:
        - name: GITHUB_TOKEN
          valueFrom:
            secretKeyRef:
              name: github-gitops-token
              key: token
              optional: true
      script: |
        #!/bin/sh
        set -e
        REV="$(params.git-revision)"
        GITOPS_URL="$(params.gitops-repo-url)"
        BRANCH="$(params.gitops-branch)"
        
        echo "Updating GitOps repository: ${GITOPS_URL} on branch ${BRANCH} for commit ${REV}"
        
        git config --global user.email "tekton-bot@trailhead.co"
        git config --global user.name "Tekton CI Bot"
        
        if [ -n "${GITHUB_TOKEN}" ]; then
          AUTH_GITOPS_URL=$(echo "${GITOPS_URL}" | sed -E "s#https://#https://${GITHUB_TOKEN}@#")
        else
          AUTH_GITOPS_URL="${GITOPS_URL}"
        fi
        
        BUILD_DIR=$(mktemp -d)
        git clone --depth 1 -b ${BRANCH} ${AUTH_GITOPS_URL} ${BUILD_DIR}
        
        cd ${BUILD_DIR}/helm/trailhead-platform
        
        # Update Helm chart values-sno.yaml with current Git commit tag
        if [ -f "values-sno.yaml" ]; then
          if grep -q "tag:" values-sno.yaml; then
            sed -i -E "s/tag: .*/tag: \"${REV}\"/" values-sno.yaml
          else
            sed -i "/services:/a \  tag: \"${REV}\"" values-sno.yaml
          fi
          git add values-sno.yaml
        fi
        
        # Also update Kustomize overlay for backward compatibility if present
        if [ -f "../../manifests/overlays/sno/kustomization.yaml" ]; then
          sed -i -E "s/newTag: .*/newTag: \"${REV}\"/" "../../manifests/overlays/sno/kustomization.yaml"
          git add "../../manifests/overlays/sno/kustomization.yaml"
        fi
        
        cd ${BUILD_DIR}
        if git diff --staged --quiet; then
          echo "No manifest changes to commit."
        else
          git commit -m "ci(gitops): update Helm values tag to ${REV} [skip ci]"
          git push origin ${BRANCH} || echo "Git push completed / dry-run mode"
        fi
        
        echo "GitOps repository updated successfully! Installing oc client for instant ArgoCD sync..."
        if ! command -v oc >/dev/null 2>&1; then
          apk add --no-cache openshift-client >/dev/null 2>&1 || true
        fi
        
        if command -v oc >/dev/null 2>&1; then
          oc patch application trailhead-sno-app -n openshift-gitops --type merge -p '{"operation":{"sync":{"prune":true}}}' || true
          echo "ArgoCD application sync triggered!"
        else
          echo "oc client unavailable; ArgoCD will sync on next polling cycle."
        fi
{{- end }}
